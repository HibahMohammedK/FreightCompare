name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: freightcompare_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d freightcompare_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"

          DB_NAME: freightcompare_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432

          REDIS_HOST: localhost
          REDIS_PORT: 6379

          STRIPE_SECRET_KEY: test
          STRIPE_PUBLISHABLE_KEY: test
          STRIPE_PRICE_ID: test
          STRIPE_WEBHOOK_SECRET: test

          TAVILY_API_KEY: test
          GROQ_API_KEY: test

          EMAIL_HOST: localhost
          EMAIL_PORT: 25
          EMAIL_HOST_USER: test
          EMAIL_HOST_PASSWORD: test
          EMAIL_USE_TLS: "False"
          DEFAULT_FROM_EMAIL: test@example.com

        run: python manage.py migrate

      - name: Run Django tests
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"

          DB_NAME: freightcompare_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432

          REDIS_HOST: localhost
          REDIS_PORT: 6379

          STRIPE_SECRET_KEY: test
          STRIPE_PUBLISHABLE_KEY: test
          STRIPE_PRICE_ID: test
          STRIPE_WEBHOOK_SECRET: test

          TAVILY_API_KEY: test
          GROQ_API_KEY: test

          EMAIL_HOST: localhost
          EMAIL_PORT: 25
          EMAIL_HOST_USER: test
          EMAIL_HOST_PASSWORD: test
          EMAIL_USE_TLS: "False"
          DEFAULT_FROM_EMAIL: test@example.com

        run: python manage.py test


  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build