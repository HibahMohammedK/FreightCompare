services:

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend

    restart: unless-stopped

    expose:
      - "8000"

    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

      FRONTEND_URL: http://localhost

      DB_NAME: freightcompare_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"

      REDIS_HOST: redis
      REDIS_PORT: "6379"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_started


  db:
    image: postgres:15

    restart: unless-stopped

    environment:
      POSTGRES_DB: freightcompare_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    expose:
      - "5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freightcompare_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7

    restart: unless-stopped

    expose:
      - "6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data: